<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>South Circle Admin</title>
<link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3f1ec;--card:#fff;--ink:#0b0b0b;--mute:#7a7873;--line:rgba(11,11,11,.12);--soft:#3a3936;--accent:#ff4a12;--ok:#1d7a46;--bad:#b42318;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);font-size:14px;line-height:1.45;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
[hidden]{display:none !important}
.logo{height:20px;width:auto;display:block}

/* login */
.auth{min-height:100vh;display:grid;place-items:center;padding:24px}
.auth__card{width:min(400px,100%);background:var(--card);border-radius:20px;padding:32px;box-shadow:0 30px 60px -40px rgba(0,0,0,.3)}
.auth__card .logo{height:22px;margin-bottom:28px}
.auth h1{font-size:26px;font-weight:500;letter-spacing:-.04em;line-height:1.1}
.auth p.sub{color:var(--mute);margin:6px 0 22px}
.auth form{display:grid;gap:12px}
.auth__links{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-size:13px;color:var(--mute)}
.auth__links button{text-decoration:underline;text-underline-offset:3px;color:var(--mute)}
.auth__links button:hover{color:var(--ink)}

/* fields + buttons */
.f{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--mute)}
.f input,.f select,.f textarea{font-size:15px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;width:100%}
.f textarea{resize:vertical;min-height:90px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ink)}
.f small{color:var(--mute);font-size:11px}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:99px;background:var(--ink);color:#fff;font-size:14px;font-weight:500;white-space:nowrap;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink);opacity:1}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(180,35,24,.3)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--soft);border:1px solid transparent}
.icon-btn:hover{border-color:var(--line);background:#fff}
.icon-btn:disabled{opacity:.3;cursor:default}
.icon-btn svg{width:16px;height:16px}
.note{font-size:13px;min-height:1em}
.note.err{color:var(--bad)}
.note.ok{color:var(--ok)}

/* shell */
.top{position:sticky;top:0;z-index:10;background:rgba(243,241,236,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top__in{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:24px}
.top__brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.top__brand span{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.tabs{display:flex;gap:4px;margin-left:12px;overflow-x:auto}
.tabs button{height:34px;padding:0 14px;border-radius:99px;color:var(--soft);display:flex;align-items:center;gap:6px;white-space:nowrap}
.tabs button.on{background:var(--ink);color:#fff}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:inline-grid;place-items:center}
.top__right{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.top__right a{color:var(--mute)}
main{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head h2{font-size:32px;font-weight:500;letter-spacing:-.045em;line-height:1}
.head p{color:var(--mute);margin-top:6px;max-width:60ch}
.head__actions{display:flex;gap:8px;flex-wrap:wrap}
.empty{background:var(--card);border-radius:var(--r);padding:48px 24px;text-align:center;color:var(--mute)}

/* inbox */
.inbox{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:16px;align-items:start}
.seg{display:inline-flex;background:#fff;border-radius:99px;padding:3px;border:1px solid var(--line)}
.seg button{height:30px;padding:0 12px;border-radius:99px;font-size:13px;color:var(--soft)}
.seg button.on{background:var(--ink);color:#fff}
.logoset{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.logoset b{font-weight:500}
.logoset p{color:var(--mute);font-size:13px;margin-top:2px;max-width:56ch}
.mlist{background:var(--card);border-radius:var(--r);overflow:hidden}
.mitem{display:block;width:100%;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);position:relative}
.mitem:last-child{border-bottom:0}
.mitem:hover{background:#faf9f6}
.mitem.on{background:#f1efe9}
.mitem b{display:block;font-weight:500;font-size:14px;padding-right:70px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem span{display:block;color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mitem time{position:absolute;right:16px;top:15px;font-size:12px;color:var(--mute)}
.mitem.unread b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:1px}
.mview{background:var(--card);border-radius:var(--r);padding:24px;min-height:300px}
.mview h3{font-size:24px;font-weight:500;letter-spacing:-.035em}
.mview .meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--mute);margin:8px 0 18px;font-size:13px}
.mview .meta a{color:var(--ink)}
.mview .body{white-space:pre-wrap;font-size:15px;line-height:1.6;border-top:1px solid var(--line);padding-top:18px}
.mview .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}

/* rows (products, clients) */
.rows{display:grid;gap:10px}
.row{background:var(--card);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.row.off{opacity:.55}
.row__title{font-weight:500;font-size:15px}
.row__sub{color:var(--mute);font-size:13px}
.row__ctl{display:flex;align-items:center;gap:2px}
.dot{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;overflow:hidden}
.dot svg{width:46%;height:46%}
.dot img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.tag{font-size:11px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--soft);margin-left:8px;vertical-align:2px}
.clogo{width:46px;height:46px;border-radius:10px;background:#f6f5f1;display:grid;place-items:center;font-weight:600;letter-spacing:-.03em;overflow:hidden}
.tface{width:46px;height:46px;border-radius:50%;background:#e9e6df;display:grid;place-items:center;overflow:hidden;font-weight:600;font-size:13px;color:var(--soft)}
.tface img{width:100%;height:100%;object-fit:cover}
.clogo img{max-width:80%;max-height:60%;object-fit:contain;filter:brightness(0)}
/* numbers */
.nrows{display:grid;gap:10px}
.nrow{background:var(--card);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:28px 80px 1fr 80px 1.4fr;gap:10px;align-items:end}
.nrow > i{font-style:normal;color:var(--mute);font-size:12px;align-self:center;font-variant-numeric:tabular-nums}
.nprev{display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
.nprev div{padding:14px 16px;border-left:1px solid var(--line)}
.nprev div:first-child{border-left:0}
.nprev small{display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.nprev b{display:block;font-size:30px;font-weight:400;letter-spacing:-.05em;margin-top:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:820px){.nrow{grid-template-columns:1fr 1fr}.nrow > i{grid-column:1/-1}.nrow .wide{grid-column:1/-1}.nprev{grid-template-columns:1fr 1fr}.nprev div:nth-child(3){border-left:0}}
/* one-colour logo tool */
.vz{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:14px}
.vz__head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.vz__head b{font-weight:500;font-size:16px;letter-spacing:-.02em}
.vz__head p{color:var(--mute);font-size:13px;margin-top:2px}
.vz__ctl{display:grid;gap:10px}
.vz__ctl label{display:grid;grid-template-columns:110px 1fr 34px;align-items:center;gap:10px;font-size:13px;color:var(--soft)}
.vz__ctl input[type=range]{width:100%;accent-color:var(--ink);padding:0;border:0;background:none;height:auto}
.vz__ctl output{font-variant-numeric:tabular-nums;color:var(--mute);text-align:right}
.vz__prev{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vz__box{height:88px;border-radius:10px;display:grid;place-items:center;padding:14px;position:relative}
.vz__box img{max-width:100%;max-height:40px;object-fit:contain}
.vz__box.dk{background:#2d3cff}
.vz__box.lt{background:#f3f1ec;border:1px solid var(--line)}
.vz__box.lt img{filter:brightness(0)}
.vz__box.src{grid-column:1/-1;height:70px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/14px 14px;border:1px solid var(--line)}
.vz__box small{position:absolute;left:8px;top:6px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.vz__box.dk small{color:rgba(255,255,255,.7)}
.vz__acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* gallery */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.gcard{background:var(--card);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.gcard.off{opacity:.55}
.gcard__pic{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#eee}
.gcard__pic img,.gcard__pic svg{width:100%;height:100%;object-fit:cover;display:block}
.gcard__pic em{position:absolute;inset:auto 0 8px;text-align:center;font-style:normal;font-size:11px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.gcard__n{position:absolute;left:8px;top:8px;background:rgba(11,11,11,.7);color:#fff;font-size:11px;border-radius:99px;padding:1px 7px}
.gcard input{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;outline:none;background:#fff}
.gcard input:focus{border-color:var(--ink)}
.gcard__ctl{display:flex;justify-content:space-between;align-items:center}
.gcard__ctl span{display:flex}
.gcard__ctl .icon-btn{width:28px;height:28px}
.drop{border:1.5px dashed rgba(11,11,11,.25);border-radius:var(--r);padding:22px;text-align:center;color:var(--mute);margin-bottom:16px;transition:background .2s,border-color .2s}
.drop.over{background:#fff;border-color:var(--ink);color:var(--ink)}

/* editor drawer */
.drawer{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end;background:rgba(11,11,11,.35)}
.drawer__panel{width:min(520px,100%);height:100%;background:var(--paper);overflow:auto;padding:24px 24px 100px;animation:slide .35s cubic-bezier(.19,1,.22,1)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer__head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.drawer__head h3{font-size:24px;font-weight:500;letter-spacing:-.04em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form{display:grid;gap:12px}
.prev{display:flex;align-items:center;gap:14px;background:#fff;border-radius:var(--r);padding:14px}
.prev .dot{width:64px;height:64px}
.color{display:flex;gap:8px;align-items:center}
.color input[type=color]{width:44px;height:42px;padding:3px;border-radius:10px;flex:none}
.drawer__foot{position:sticky;bottom:-100px;display:flex;gap:8px;align-items:center;margin-top:20px;padding:16px 0;background:var(--paper)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:13px;z-index:60;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.toast.err{background:var(--bad)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:r .8s linear infinite;margin:40px auto}
@keyframes r{to{transform:rotate(360deg)}}

@media (max-width:820px){
  .top__in{flex-wrap:wrap;gap:10px;padding:12px 16px}
  .tabs{order:3;width:100%;margin-left:0}
  main{padding:20px 16px 80px}
  .inbox{grid-template-columns:1fr}
  .grid2{grid-template-columns:1fr}
  .row{grid-template-columns:auto 1fr;}
  .row__ctl{grid-column:1/-1;justify-content:flex-end}
}
</style>
</head>
<body>

<!-- sign in -->
<section class="auth" id="auth" hidden>
  <div class="auth__card">
    <svg class="logo" viewBox="0 0 954 143" fill="none" aria-label="South Circle"><use href="#mark"/></svg>
    <h1 id="authTitle">Sign in</h1>
    <p class="sub" id="authSub">Manage the South Circle website.</p>
    <form id="authForm" novalidate>
      <label class="f" id="fEmail">Email<input name="email" type="email" autocomplete="email" required></label>
      <label class="f" id="fPass">Password<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
      <button class="btn" type="submit" id="authBtn">Sign in</button>
      <p class="note" id="authNote" role="status"></p>
    </form>
    <div class="auth__links" id="authLinks">
      <button type="button" data-mode="signup">First time? Create your account</button>
      <button type="button" data-mode="forgot">Forgot password?</button>
    </div>
  </div>
</section>

<!-- not an admin -->
<section class="auth" id="denied" hidden>
  <div class="auth__card">
    <h1>No admin access</h1>
    <p class="sub"><span id="deniedEmail"></span> is signed in, but it isn't on the South Circle admin list.</p>
    <button class="btn ghost" type="button" data-signout>Sign out</button>
  </div>
</section>

<!-- the admin -->
<div id="app" hidden>
  <header class="top">
    <div class="top__in">
      <a class="top__brand" href="/admin/"><svg class="logo" viewBox="0 0 954 143" fill="none" aria-label="South Circle"><use href="#mark"/></svg><span>Admin</span></a>
      <nav class="tabs" id="tabs">
        <button data-tab="inbox">Inbox <i class="badge" id="unread" hidden></i></button>
        <button data-tab="products">Products</button>
        <button data-tab="numbers">Stats</button>
        <button data-tab="gallery">Gallery</button>
        <button data-tab="clients">Clients</button>
        <button data-tab="team">Team</button>
        <button data-tab="content">Content</button>
        <button data-tab="pages">Pages</button>
      </nav>
      <div class="top__right"><a href="/" target="_blank" rel="noopener">View site ↗</a><span id="who"></span><button class="btn ghost sm" type="button" data-signout>Sign out</button></div>
    </div>
  </header>
  <main id="view"></main>
</div>

<div class="drawer" id="drawer" hidden><div class="drawer__panel" id="drawerPanel"></div></div>
<input type="file" id="picker" accept="image/*" hidden>

/* ---------- session (Supabase Auth over plain HTTP) ---------- */
let session = null;
try { session = JSON.parse(localStorage.getItem('sc_admin_session') || 'null'); } catch (e) { session = null; }
const saveSession = s => {
  session = s ? { access_token: s.access_token, refresh_token: s.refresh_token, expires_at: s.expires_at || Math.floor(Date.now() / 1000) + (s.expires_in || 3600), user: s.user || session?.user } : null;
  try { session ? localStorage.setItem('sc_admin_session', JSON.stringify(session)) : localStorage.removeItem('sc_admin_session'); } catch (e) {}
};
async function auth(path, body, token) {
  const r = await fetch(`${SB_URL}/auth/v1/${path}`, { method: 'POST',
    headers: { apikey: SB_KEY, 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}) }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.msg || j.error_description || j.message || j.error || `Error ${r.status}`);
  return j;
}
async function fresh() {
  if (!session) throw new Error('Signed out');
  if (session.expires_at * 1000 - Date.now() < 60000) {
    try { saveSession(await auth('token?grant_type=refresh_token', { refresh_token: session.refresh_token })); }
    catch (e) { saveSession(null); showAuth('signin', 'Your session ended. Please sign in again.'); throw e; }
  }
  return session.access_token;
}
/* database + storage calls as the signed-in admin */
async function api(path, { method = 'GET', body, headers = {}, raw } = {}) {
  const token = await fresh();
  const r = await fetch(SB_URL + path, { method,
    headers: { apikey: SB_KEY, Authorization: `Bearer ${token}`, ...(body !== undefined && !raw ? { 'Content-Type': 'application/json' } : {}), ...headers },
    body: body === undefined ? undefined : raw ? body : JSON.stringify(body) });
  const text = await r.text();
  let j = null; try { j = text ? JSON.parse(text) : null; } catch (e) {}
  if (!r.ok) throw new Error((j && (j.message || j.msg || j.error)) || `Error ${r.status}`);
  return j;
}

/* ---------- uploads: photos are resized in the browser before upload ---------- */
async function shrink(file, max) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file;
  const img = await createImageBitmap(file).catch(() => null);
  if (!img) return file;
  const k = Math.min(1, max / Math.max(img.width, img.height));
  if (k === 1 && file.size < 900000) return file;
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(res => c.toBlob(res, 'image/webp', 0.86));
  return blob ? new File([blob], file.name.replace(/\.\w+$/, '') + '.webp', { type: 'image/webp' }) : file;
}
async function upload(file, folder, max = 1600) {
  if (!file.type.startsWith('image/')) throw new Error('Please choose an image file.');
  const f = await shrink(file, max);
  if (f.size > 10 * 1024 * 1024) throw new Error('That image is over 10 MB.');
  const ext = (f.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
  const path = `${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  await api(`/storage/v1/object/${BUCKET}/${path}`, { method: 'POST', body: f, raw: true, headers: { 'Content-Type': f.type, 'x-upsert': 'false', 'cache-control': '31536000' } });
  return `${SB_URL}/storage/v1/object/public/${BUCKET}/${path}`;
}
async function removeFile(url) {
  const pre = `${SB_URL}/storage/v1/object/public/${BUCKET}/`;
  if (!url || !url.startsWith(pre)) return;
  try { await api(`/storage/v1/object/${BUCKET}`, { method: 'DELETE', body: { prefixes: [url.slice(pre.length)] } }); } catch (e) {}
}

      if (r.access_token) { saveSession(r); await boot(); }
      else showAuth('signin', 'Check your inbox and click the confirmation link, then sign in here.', true);
    } else if (mode === 'forgot') {
      await auth(`recover?redirect_to=${encodeURIComponent(ADMIN_URL)}`, { email });
      showAuth('signin', 'If that email has an account, a reset link is on its way.', true);
    } else if (mode === 'reset') {
      const token = await fresh();
      const r = await fetch(`${SB_URL}/auth/v1/user`, { method: 'PUT', headers: { apikey: SB_KEY, Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
      if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.msg || j.message || 'Could not save the password.'); }
      toast('Password saved'); await boot();
    }
  } catch (err) {
    const m = String(err.message || err);
    note.textContent = /invalid login/i.test(m) ? 'That email and password don’t match.' : /not confirmed/i.test(m) ? 'Confirm your email first: check your inbox for the link.' : m;
    note.className = 'note err';
  }
  btn.disabled = false;
});
document.addEventListener('click', async e => {
  if (!e.target.closest('[data-signout]')) return;
  try { if (session) await auth('logout', {}, session.access_token); } catch (err) {}
  saveSession(null); showAuth('signin');
});

/* links from emails come back with the session in the URL hash */
function readHash() {
  if (!location.hash.includes('access_token=')) {
    if (location.hash.includes('error_description=')) {
      const p = new URLSearchParams(location.hash.slice(1)); history.replaceState(null, '', location.pathname);
      return { error: p.get('error_description') };
    }
    return null;
  }
  const p = new URLSearchParams(location.hash.slice(1));
  saveSession({ access_token: p.get('access_token'), refresh_token: p.get('refresh_token'), expires_in: +p.get('expires_in') || 3600 });
  history.replaceState(null, '', location.pathname);
  return { type: p.get('type') };
}

/* ---------- app ---------- */
let tab = 'inbox';
async function boot() {
  try {
    const user = await api('/auth/v1/user');
    session.user = user; saveSession(session);
    const ok = await api('/rest/v1/rpc/sc_is_admin', { method: 'POST', body: {} });
    if (!ok) { $('#auth').hidden = true; $('#app').hidden = true; $('#denied').hidden = false; $('#deniedEmail').textContent = user.email; return; }
    $('#auth').hidden = true; $('#denied').hidden = true; $('#app').hidden = false;
    $('#who').textContent = user.email;
    const want = location.pathname.split('/')[2] || location.hash.slice(1);   // /admin/products
    go(['inbox', 'products', 'numbers', 'gallery', 'clients', 'team', 'content', 'pages', 'settings'].includes(want) ? want : 'inbox');
  } catch (err) {
    if (session) { saveSession(null); }
    showAuth('signin', session === null && err.message !== 'Signed out' ? err.message : '');
  }
}
$('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) go(b.dataset.tab); });
addEventListener('hashchange', () => { const t = location.hash.slice(1); if (!$('#app').hidden && t && t !== tab && VIEWS[t]) go(t); });
function go(t) {
  tab = t;
  history.replaceState(null, '', t === 'inbox' ? '/admin/' : '/admin/' + t);
  document.querySelectorAll('#tabs [data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  $('#view').innerHTML = '<div class="spin"></div>';
  closeDrawer();
  VIEWS[t]().catch(err => { $('#view').innerHTML = `<div class="empty">Couldn’t load this: ${esc(err.message)}</div>`; });
  refreshUnread();
}
async function refreshUnread() {
  try {

    const b = $('#unread'); b.textContent = r.length; b.hidden = !r.length;

}
const when = d => {
  const t = new Date(d), now = new Date();
  return t.toDateString() === now.toDateString() ? t.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : t.toLocaleDateString([], { day: 'numeric', month: 'short', year: t.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
};

/* reorder: swap with the neighbour and save both positions */
async function move(table, list, i, dir) {
  const j = i + dir; if (j < 0 || j >= list.length) return;
  const a = list[i], b = list[j];
  const sa = a.sort === b.sort ? i + 1 : a.sort, sb = a.sort === b.sort ? j + 1 : b.sort;
  await Promise.all([db.update(table, a.id, { sort: sb }), db.update(table, b.id, { sort: sa })]);
}
const nextSort = list => list.reduce((m, r) => Math.max(m, r.sort || 0), 0) + 1;

  const q = s => slot.querySelector(s), note = (t, err) => { q('#vzNote').textContent = t; q('#vzNote').className = 'note' + (err ? ' err' : ''); };
  let px = null, mode = 'whole', svg = '', timer = 0, srcUrl = '';
  const setMode = m => { mode = m; slot.querySelectorAll('#vzMode button').forEach(b => b.classList.toggle('on', b.dataset.m === m)); q('#vzThr').disabled = m === 'whole'; };
  const run = () => {
    clearTimeout(timer); note('Tracing…'); q('#vzUse').disabled = true;
    timer = setTimeout(() => {
      try {
        svg = traceLogo(px, mode, +q('#vzThr').value, +q('#vzSp').value, q('#vzSm').checked);
        if (!svg) { q('#vzOutD').removeAttribute('src'); q('#vzOutL').removeAttribute('src'); return note('Nothing left to trace. Try another option or move the cut.', 1); }
        const u = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        q('#vzOutD').src = u; q('#vzOutL').src = u; q('#vzUse').disabled = false;
        note(`Vector ready · ${(svg.length / 1024).toFixed(1)} KB`);
      } catch (e) { note('That didn’t trace. Try another option.', 1); }
    }, 120);
  };
  const load = async src => {
    try {
      note('Loading…'); q('#vzUse').disabled = true;
      if (srcUrl) URL.revokeObjectURL(srcUrl);
      srcUrl = src instanceof Blob ? URL.createObjectURL(src) : ''; q('#vzSrc').src = srcUrl || src;
      px = await rasterize(src);
      setMode(guessMode(px, +q('#vzThr').value)); run();
    } catch (e) { note(e.message || 'Couldn’t open that image.', 1); }
  };
  slot.querySelector('.vz').addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.m) { setMode(b.dataset.m); run(); }
    if (b.dataset.vz === 'close') { if (srcUrl) URL.revokeObjectURL(srcUrl); slot.innerHTML = ''; }
    if (b.id === 'vzFile') { const [f] = await pick(); if (f) load(f); }
    if (b.id === 'vzUse') {
      b.disabled = true; note('Saving the vector…');
      try {
        const url = await upload(new File([svg], 'logo.svg', { type: 'image/svg+xml' }), 'clients');
        if (srcUrl) URL.revokeObjectURL(srcUrl); slot.innerHTML = ''; onUse(url);
      } catch (err) { b.disabled = false; note(err.message, 1); }
    }
  });
  q('#vzThr').oninput = () => { q('#vzThrO').textContent = q('#vzThr').value; if (px) run(); };
  q('#vzSp').oninput = () => { q('#vzSpO').textContent = q('#vzSp').value; if (px) run(); };
  q('#vzSm').onchange = () => { if (px) run(); };
  slot.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  load(source);
}

(async () => {
  const h = readHash();
  if (h?.error) return showAuth('signin', h.error);
  if (h?.type === 'recovery') return showAuth('reset');
  if (session) return boot();
  showAuth('signin', h?.type === 'signup' ? 'Email confirmed. Sign in to continue.' : '', true);
})();
